model_instructions_file = "/home/ritch/.codex/engram-instructions.md"
experimental_compact_prompt_file = "/home/ritch/.codex/engram-compact-prompt.md"
model = "gpt-5.6-sol"
model_reasoning_effort = "low"
[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]

[marketplaces.engram]
source_type = "git"
source = "https://github.com/Gentleman-Programming/engram.git"
ref = "main"

[plugins."engram@engram"]
enabled = true

[features]
multi_agent = true

[agents]
max_depth = 2
max_threads = 4

[mcp_servers.engram]
command = "engram"
args = ["mcp", "--tools=agent"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
