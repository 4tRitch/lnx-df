font_family               CaskaydiaCoveNerdFont
bold_font                 CaskaydiaCoveNerdFont
italic_font_family        CaskaydiaCoveNerdFont
bold_italic_font_family   CaskaydiaCoveNerdFont

font_size 16.0


disable_ligatures never

enable_audio_bell yes
window_alert_on_bell yes

# Primary terminal theme. To switch back to the secondary dark theme, replace
# this include with: include themes/gentle-dark-secondary.conf
include themes/dark.conf

shell /usr/bin/fish

# Fix image paste over SSH: allow remote OSC 52 clipboard reads
# Default kitty denies read-clipboard, which blocks opencode's image paste
# when running via SSH (remote needs to query local Wayland clipboard through Kitty).
# kitty +kitten ssh proxies this automatically when this is enabled.
clipboard_control write-clipboard read-clipboard write-primary read-primary

# Needed for kitty +kitten ssh clipboard + graphics passthrough
allow_remote_control yes
listen_on unix:/tmp/kitty

